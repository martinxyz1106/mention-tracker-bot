name: Mention Tracker

on:
  schedule:
    # 10:00 KST (UTC+9) == 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check mentions and notify Slack
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python scripts/check_mentions.py

      - name: Commit updated state
        run: |
          git config user.name "mention-tracker-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update notified state"
          git push
