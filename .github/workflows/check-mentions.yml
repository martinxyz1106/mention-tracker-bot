name: Mention Tracker

on:
  schedule:
    # 08:05 / 16:05 KST (UTC+9) == 23:05 (전날) / 07:05 UTC
    # 정각(0분)은 GitHub Actions 스케줄 부하가 몰려 실행이 드롭되기 쉬워 5분 뒤로 설정
    - cron: '5 23,7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check mentions and notify Slack
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python scripts/check_mentions.py

      - name: Commit updated state
        run: |
          git config user.name "mention-tracker-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update notified state"
          git push
