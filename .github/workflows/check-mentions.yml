name: Mention Tracker

on:
  schedule:
    # 08:05~08:30 / 16:05~16:30 KST (UTC+9) == 23:05~23:30 (전날) / 07:05~07:30 UTC, 5분 간격 반복 시도
    # GitHub Actions의 schedule 트리거는 정시 실행을 보장하지 않고 드롭될 수 있어(공식 문서에 명시),
    # 한 시점에 한 번만 걸면 그 실행이 드롭될 경우 알림이 아예 안 온다.
    # 같은 시간대에 여러 번 걸어두고 스크립트 쪽에서 "그 슬롯에 이미 성공 처리했으면 스킵"하도록 해서
    # 하나가 드롭돼도 다른 시도가 대신 실행되게 한다. (0분은 GitHub 부하가 몰려 특히 드롭되기 쉬워 제외)
    - cron: '5-30/5 23,7 * * *'
    # TEMP TEST: 10:05~10:30 KST (UTC 01:05~01:30) — 새 윈도우 dedup 로직 실동작 검증용, 확인 후 제거 예정
    - cron: '5-30/5 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check mentions and notify Slack
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python scripts/check_mentions.py

      - name: Commit updated state
        run: |
          git config user.name "mention-tracker-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update notified state"
          git push
